# example-02 — ★ Style-blend sample: rap + Chinese style (in the manner of "Peach Blossom Fan")
#
# Only demonstrates the division-of-labor table in meta.style_layers and lint #17. The form/arrangement sections are abbreviated illustrations,
# not a full spec (so other self-check items will fail); only #17 matters.
#
# The blending mechanism does not depend on whether a specific style skill exists.

spec_version: "1.0"
meta:
  title: "Fan Face (illustrative)"
  style_layer: mc-style-chinese-pop
  style_layers:
    - {skill: mc-style-chinese-pop, role: base,    owns: [harmony, melody, color_instruments, vocal_delivery_chorus, form]}
    - {skill: mc-style-hiphop,      role: overlay, owns: [groove, low_end, vocal_delivery_verse]}
  fusion_note: "Verse rap supplies narrative density, the chorus pentatonic melody supplies the memorable hook; Chinese folk sampling serves only as a color layer, while the groove is left to the 808 — the dimensions each side occupies do not overlap"
  key: "D minor"
  meter: "4/4"
  tempo: 88
  target_duration: "1:33"
  deliverable: [full_mix]
intent:
  one_thing: "The moment a fan turns from a love token into evidence"
  reference_pair:
    - {track: "Wang Sulong - Peach Blossom Fan (桃花扇)", borrow: "only borrows the section split of 'rap in the verse, sung chorus'"}
    - {track: "Jay Chou - Blue and White Porcelain (青花瓷)", borrow: "only borrows the way the chorus pentatonic melody resolves on la"}
  listener_situation: "phone speaker, first listen"
  emotional_arc: [{section: A1, mood: narration, value: 3}, {section: C1, mood: grief, value: 7}, {section: A2, mood: cold, value: 4}]
material:
  motif: "The three-note descending motif from the first verse line (minor third plus major second), entering on a weak beat and landing on a strong beat, one and a half beats long"
  character: "suppressed, refusing to lift its head"
  stated_in: [A1]

form:
  - {id: A1, name: Verse,  bars: 14, start_bar: 1,  harmony: "|Im |bVII |Im |V7 |", harmony_letters: "|Dm |C |Dm |A7 |", development: new, energy: 3}
  - {id: C1, name: Chorus, bars: 8,  start_bar: 15, harmony: "|Im |bVI |bIII |V7 |", harmony_letters: "|Dm |Bb |F |A7 |", development: extend, energy: 7}
  - {id: A2, name: Verse,  bars: 12, start_bar: 23, harmony: "|Im |bVII |Im |V7 |", harmony_letters: "|Dm |C |Dm |A7 |", development: repeat+vary, energy: 4}
arrangement:
  roster:
    - {id: k808,   midi: {program: 0, bank: 0, channel: 10}, instrument: "808 kick + sub", role: low end, band: "low end", entry: A1, exit: end}
    - {id: guzheng, midi: {program: 107, bank: 0, channel: 2}, instrument: "guzheng sample, used only for phrase-end ornaments", role: color, band: "mid-high", entry: C1, exit: C1}
    - {id: vox,    midi: {program: 53, bank: 0, channel: 1}, instrument: "male voice, rap in the verse, sung in the chorus", role: melody, band: "mid-high", entry: A1, exit: end}
  energy_curve: {A1: 3, C1: 7, A2: 4}
  subtraction_events: [{at: {section: A2}, what: "remove the 808, leaving only guzheng harmonics and vocal", why: "the evidence section should feel cold"}]
  hooks: {arrangement_hook: {what: "guzheng three-note descent la-sol-mi only at the chorus phrase end", first_at: C1, recurs_at: [C1]}}
  groove: {feel: halftime, push_pull: [{part: vox, offset_ms: -15, note: "rap pushes ahead of the beat"}], fill_policy: {bars: [14, 21], rationale: "before section changes"}}
vocal:
  persona: "male voice, lower-middle register, spoken-style in the verse, chest voice in the chorus"
  delivery: {A1: "rap, consonants forceful", C1: "sung, more breathy", A2: "rap, closer to the mic and lighter"}
  dynamics_by_section: {A1: 5, C1: 8, A2: 3}
  chorus_variation: "only one chorus pass, illustrative"
mix_intent: {mood: "cold, dry, hard like fan ribs", dynamics: {target_DR_dB: 9}, width_map: {A1: narrow, C1: wide, A2: narrow}, loudness_target: "-10 LUFS"}
render: {suno: {style_prompt: "illustrative"}}
checks: {self_audit: [], exemptions: []}
