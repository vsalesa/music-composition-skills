# ARR-SPEC example ①: City Pop "Last Train" (《末班电车》)
# Purpose: positive sample, all 20 self-check items pass; material for the B group in the AB experiment.
# This spec deliberately makes an explicit choice on every self-check item, and can serve as a yardstick for "how detailed to be".

spec_version: "1.0"

meta:
  title: "Last Train (末班电车)"
  style_layer: "mc-style-citypop-rnb"
  key: "D major"
  mode: "ionian"
  meter: "4/4"
  tempo: 112
  target_duration: "4:04"        # 114 bars × 4 beats ÷ 112 BPM = 244 s
  deliverable: [full_mix, stems, midi, musicxml]

intent:
  one_thing: "A person takes the last train home, and suddenly doesn't want to get off at their stop."
  reference_pair:
    - track: "Tatsuro Yamashita - Sparkle"
      borrow: "only borrows the sustained texture of the clean guitar playing 16th notes over the intro, not its bright mood"
    - track: "Mariya Takeuchi - Plastic Love"
      borrow: "only borrows the sense of distance between the chorus vocal and the harmonies (the vocal does not sit in your face), not its harmonic movement"
  listener_situation: "Commuting at night with headphones on, first listen; the window outside takes away half the attention, so a memorable point must appear within the first 20 seconds."
  emotional_arc:
    - {section: I,  mood: "suspended, undecided",            value: 2}
    - {section: A1, mood: "restrained everyday narration",    value: 3}
    - {section: B1, mood: "starts getting restless",          value: 5}
    - {section: C1, mood: "letting go",                       value: 8}
    - {section: A2, mood: "back to the everyday, but can't go back", value: 4}
    - {section: B2, mood: "more urgent",                      value: 6}
    - {section: C2, mood: "fully letting go",                 value: 9}
    - {section: D,  mood: "emptied out, a moment of regret",  value: 3}   # ← the turn is here
    - {section: C3, mood: "no regret anymore",                value: 10}
    - {section: O,  mood: "car door closes",                  value: 4}

material:
  motif: "Descending four-note motif of the first verse line: two stepwise notes, then a leap of a third; two beats long, starting in the second half of beat two"
  character: "relaxed, leaning back"
  stated_in: [A1]

form:
  - id: I
    name: "Intro"
    bars: 6                       # ★ not a multiple of 8: makes the opening asymmetric from the start
    start_bar: 1
    harmony: "|IVmaj7 |III7 |VIm7 |%  |IVmaj7 |V |"
    harmony_letters: "|Gmaj7 |F#7 |Bm7 |%  |Gmaj7 |A |"
    melody_register: "mid-high"
    development: new
    energy: 2
    events: [ep_in, syn_lead_in]
    note: "6 bars rather than 8 — bars 5–6 are a phrase with half cut off, so when the vocal enters it sounds 'early'"

  - id: A1
    name: "Verse"
    bars: 16
    start_bar: 7
    harmony: "|Imaj7 |IIIm7 |IVmaj7 |V |VIm7 |IIIm7 |IVmaj7 |V |x2"
    harmony_letters: "|Dmaj7 |F#m7 |Gmaj7 |A |Bm7 |F#m7 |Gmaj7 |A |x2"
    melody_register: "mid-low"
    development: new
    energy: 3
    events: [drums_in, bass_in, gtr_in, vocal_in]
    note: "The vocal stays in the mid-low register throughout, leaving room for a sixth-interval lift into the chorus"

  - id: B1
    name: "Pre-Chorus"
    bars: 6                       # ★ not 8: the lift phrase is deliberately short, to push the chorus forward early
    start_bar: 23
    harmony: "|IIm7 |IIIm7 |IVmaj7 |#IVm7b5 |V |%  |"
    harmony_letters: "|Em7 |F#m7 |Gmaj7 |G#m7b5 |A |%  |"
    melody_register: "mid"
    development: sequence
    energy: 5
    events: [strings_teaser]
    note: "#IVm7♭5 is the first out-of-key chord in the song; its role is to make the chorus's I feel like 'finally arrived'"

  - id: C1
    name: "Chorus"
    bars: 16
    start_bar: 29
    harmony: "|IVmaj7 |V |IIIm7 |VIm7 |IVmaj7 |V |Imaj7 |%  |x2"
    harmony_letters: "|Gmaj7 |A |F#m7 |Bm7 |Gmaj7 |A |Dmaj7 |%  |x2"
    melody_register: "mid-high"
    development: new
    energy: 8
    events: [strings_in, syn_hook_returns]
    note: "The 'royal road' (wangdao) progression, 4-5-3-6. The first syllable is the highest note of the whole section, with no lead-in."

  - id: A2
    name: "Verse"
    bars: 12                      # ★ 4 bars shorter than A1: the second verse must not be a verbatim copy
    start_bar: 45
    harmony: "|Imaj7 |IIIm7 |IVmaj7 |V |VIm7 |IIIm7 |IVmaj7 |V |IIm7 |IIIm7 |IVmaj7 |V |"
    harmony_letters: "|Dmaj7 |F#m7 |Gmaj7 |A |Bm7 |F#m7 |Gmaj7 |A |Em7 |F#m7 |Gmaj7 |A |"
    melody_register: "mid-low"
    development: vary
    energy: 4
    events: [gtr_out_half, strings_out]
    note: "Cut the first half of A1's second pass; cover the seam with the fill at bar 44"

  - id: B2
    name: "Pre-Chorus"
    bars: 6
    start_bar: 57
    harmony: "|IIm7 |IIIm7 |IVmaj7 |#IVm7b5 |V |%  |"
    harmony_letters: "|Em7 |F#m7 |Gmaj7 |G#m7b5 |A |%  |"
    melody_register: "mid-high"
    development: repeat
    energy: 6
    events: [drums_build]
    note: "Same harmony as B1, but the vocal is an octave higher and the drums switch to continuous 16th-note hits"

  - id: C2
    name: "Chorus"
    bars: 16
    start_bar: 63
    harmony: "|IVmaj7 |V |IIIm7 |VIm7 |IVmaj7 |V |Imaj7 |%  |x2"
    harmony_letters: "|Gmaj7 |A |F#m7 |Bm7 |Gmaj7 |A |Dmaj7 |%  |x2"
    melody_register: "mid-high"
    development: repeat
    energy: 9
    events: [full_band, gtr_exit_after]
    note: "The final half-beat before entry, all parts silent (see subtraction_events)"

  - id: D
    name: "Bridge"
    bars: 10                      # ★ not 8
    start_bar: 79
    harmony: "|bVImaj7 |bVII |IIIm7 |VI7 |bVImaj7 |bVII |Imaj7 |V/V |V |%  |"
    harmony_letters: "|Bbmaj7 |C |F#m7 |B7 |Bbmaj7 |C |Dmaj7 |E7 |A |%  |"
    melody_register: "low"
    development: fragment
    energy: 3                     # ★ the drop point of the energy curve
    events: [drums_out, bass_out, sax_in]
    note: "★ The only key-change section in the whole song: ♭VI/♭VII borrowed from the parallel minor of the same tonic; VI7 and V/V are secondary dominants. Drums and bass fully pulled out, leaving only electric piano + vocal + sax"

  - id: C3
    name: "Chorus"
    bars: 18                      # ★ 2 bars more tag than C1/C2
    start_bar: 89
    harmony: "|IVmaj7 |V |IIIm7 |VIm7 |IVmaj7 |V |Imaj7 |%  |x2 |IVmaj7 |V |"
    harmony_letters: "|Gmaj7 |A |F#m7 |Bm7 |Gmaj7 |A |Dmaj7 |%  |x2 |Gmaj7 |A |"
    melody_register: "high"
    development: recap
    energy: 10
    events: [all_in, vocal_ad_lib]
    note: "The tag in the last 2 bars does not resolve; it hangs on V and goes straight into the Outro"

  - id: O
    name: "Outro"
    bars: 8
    start_bar: 107
    harmony: "|IVmaj7 |III7 |VIm7 |%  |IVmaj7 |III7 |VIm7 |%  |"
    harmony_letters: "|Gmaj7 |F#7 |Bm7 |%  |Gmaj7 |F#7 |Bm7 |%  |"
    melody_register: "mid-high"
    development: fragment
    energy: 4
    events: [vocal_out, sax_solo, fade_none]
    note: "Returns to the Intro's harmony but stops on VIm — set out from D, came back to Bm: 'didn't reach the stop'. Not faded out; hard cut."

arrangement:
  roster:
    - {id: drums_acoustic, midi: {program: 0, bank: 0, channel: 10}, instrument: "70s-recorded acoustic drums + gated snare", role: "groove",         band: "60 Hz–12 kHz", entry: A1, exit: end,  note: "D section entirely silent"}
    - {id: bass_el,        midi: {program: 33, bank: 0, channel: 2}, instrument: "Precision Bass, fingerstyle, short sustain", role: "low end",     band: "40–250 Hz",    entry: A1, exit: end,  note: "rushes the beat by 12 ms"}
    - {id: ep_rhodes,      midi: {program: 4, bank: 0, channel: 3}, instrument: "Rhodes Mk I + light chorus",              role: "harmonic bed", band: "200 Hz–2 kHz", entry: I,  exit: end,  note: "register limited to C3–C4"}
    - {id: gtr_clean_16th, midi: {program: 27, bank: 0, channel: 4}, instrument: "Strat single-coil, muted 16th-note strumming", role: "texture",  band: "1–3 kHz",      entry: A1, exit: C2,   note: "★ does not appear after section D, giving the space to the sax"}
    - {id: syn_lead_saw,   midi: {program: 81, bank: 0, channel: 5}, instrument: "Prophet-style sawtooth monophonic line, slow glide", role: "memory point", band: "1.5–4 kHz", entry: I, exit: end,  note: "plays only the hook, not a pad"}
    - {id: strings_pad,    midi: {program: 48, bank: 0, channel: 6}, instrument: "string section, long notes in high position", role: "color",     band: "400 Hz–6 kHz", entry: C1, exit: end,  note: "exits once in A2, returns in C2"}
    - {id: sax_tenor,      midi: {program: 66, bank: 0, channel: 7}, instrument: "tenor saxophone",                         role: "melody",     band: "250 Hz–4 kHz", entry: D,  exit: O,    note: "★ enters only past the halfway point of the song; the Outro belongs to it"}
    - {id: vocal_lead,     midi: {program: 53, bank: 0, channel: 1}, instrument: "female voice, breathy, not in your face", role: "melody",     band: "200 Hz–8 kHz", entry: A1, exit: C3,   note: "★ no vocal in the Outro"}

  depth_map: {vocal_lead: foreground, syn_lead_saw: foreground, sax_tenor: foreground, gtr_clean_16th: midground, drums_acoustic: midground, bass_el: background, ep_rhodes: background, strings_pad: background}
  bass_kick_relation: {mode: interlocking, detail: "In the A/B sections the bass avoids the kick hits (answering each other); in the C section it coincides with the kick and thickens (combining); no drums in section D"}

  spectrum_budget:
    - {band: "40–120 Hz",   owner: bass_el,        competitors: [drums_acoustic], resolution: "Kick sidechains the bass; bass releases over 30 ms and yields 3 dB on the kick hit"}
    - {band: "200–500 Hz",  owner: ep_rhodes,      competitors: [strings_pad, vocal_lead], resolution: "Stagger the registers: ep limited to C3–C4, strings written only above C4"}
    - {band: "1–3 kHz",     owner: gtr_clean_16th, competitors: [syn_lead_saw],   resolution: "Alternating: gtr appears only in the A/B sections, syn_lead only in the phrase-end gaps of the I/C/O sections"}
    - {band: "6–12 kHz",    owner: drums_acoustic, competitors: [strings_pad],    resolution: "strings roll off above 8 kHz, leaving the air to the hi-hat"}

  energy_curve: {I: 2, A1: 3, B1: 5, C1: 8, A2: 4, B2: 6, C2: 9, D: 3, C3: 10, O: 4}

  subtraction_events:
    - {at: {section: C2, bar_offset: -1, beat: 4.5}, what: "entire band (including drums) fully silent for the final half-beat before entry", why: "The second chorus cannot win over the first by being louder; it wins through the hole before it"}
    - {at: {section: D}, what: "drums and bass fully removed for the whole section, leaving only electric piano + vocal + sax", why: "The lowest energy point of the song must come before C3, otherwise C3 does not hold"}
    - {at: {section: A2}, what: "strings and half the guitars exit", why: "The second verse must be emptier than the first, not fuller"}

  hooks:
    vocal_hook:
      where: "C1 bars 1–2"
      shape: "The first syllable lands directly on the highest note of the section, then steps down 5→3, with no lead-in"
    arrangement_hook:
      what: "syn_lead_saw three-note ascending riff: D–E–F#; the last note is held for a beat and a half, then slides slowly down a minor third"
      first_at: I
      recurs_at: [C1, C2, C3, O]

  groove:
    feel: "straight16"
    push_pull:
      - {part: bass_el,        offset_ms: -12, note: "bass rushes the beat; the only source of the song's 'driving forward' feel"}
      - {part: gtr_clean_16th, offset_ms: 8,   note: "strumming dragged slightly, separated from the bass, producing an illusion of width"}
      - {part: drums_acoustic, offset_ms: 0,   note: "drums hold the grid as the reference frame"}
    fill_policy:
      bars: [22, 28, 44, 62, 78, 88, 106]
      rationale: "Only in the bar before section changes; bar 44 is the only mid-section fill, used to cover the seam where A2 is 4 bars shorter than A1. Deliberately unevenly spaced."

vocal:
  persona: "Female voice in her twenties, mainly lower-mid register (lifted to mid-high in the chorus), breathy and not in your face, with the urban texture of 1980s Tokyo city pop"
  delivery: "Half-voiced with plenty of breath; loose diction, not aiming for crisp pronunciation — this song is talking to oneself, not making a declaration"
  dynamics_by_section: {I: 0, A1: 3, B1: 5, C1: 7, A2: 4, B2: 6, C2: 8, D: 2, C3: 9, O: 0}
  phrasing:
    - {line: "C1 first line", timing: "rushed 40 ms", why: "The first syllable of the chorus is the highest note; rushing it in keeps it from sounding like a lead-in"}
    - {line: "end of each A2 line", timing: "dragged 80 ms", why: "The second verse must be lazier than the first; achieved by dragging rather than cutting notes"}
    - {line: "last two lines of D", timing: "free", why: "Drums and bass have been pulled, so let the vocal leave the grid"}
  breath_points:
    - {section: C1, line: 1, after_syllable: 8, note: "Breathe after bar 2; keep the breath sound, don't cut it"}
    - {section: D, line: 4, after_syllable: 0, note: "The last 2 bars of section D are not sung at all (the silence, see self_audit)"}
  ad_libs:
    - {at: {section: C2}, what: "one very light upward slide at the end of a phrase, only once"}
    - {at: {section: C3, bar_offset: 12}, what: "improvised ad-libs layered on the tag in bars 13–16, offset from the main melody"}
  chorus_variation: "C1 straightforward; C2 last note held an extra half-beat; C3 line 3 sung an octave lower, line 4 returns to the original range"
  stacking: "C1 no harmony; C2 one layer of thirds added; C3 two layers of thirds plus sixths, only on the line 'doesn't want to get off'"
  register_arc: "A section mid-low → C section mid-high → D section falls back to low → C3 highest of the whole song"

mix_intent:
  ducking_map:
    - {section: C1, who_yields: strings_pad, band: "1–3 kHz",    to: vocal_lead}
    - {section: C2, who_yields: strings_pad, band: "1–3 kHz",    to: vocal_lead}
    - {section: A1, who_yields: ep_rhodes,   band: "200–500 Hz", to: vocal_lead}
    - {section: A2, who_yields: ep_rhodes,   band: "200–500 Hz", to: vocal_lead}
    - {section: O,  who_yields: ep_rhodes,   band: "250 Hz–4 kHz", to: sax_tenor}
  dynamics:
    target_DR_dB: 10
    notes:
      - "Section D must be 6 dB lower than C2 (short-term loudness); this is the only large drop allowed in the song"
      - "C3 is only 1.5 dB louder than C2; the extra impact comes from the lineup and the 18-bar length, not from volume"
  width_map: {I: medium, A1: narrow, B1: medium, C1: wide, A2: narrow, B2: medium, C2: wide, D: narrow, C3: wide, O: medium}
  loudness_target: "-10 LUFS integrated"

render:
  suno:
    style_prompt: "1980s Japanese city pop, 112 BPM, D major, Rhodes electric piano, 16th-note muted clean guitar, electric bass playing ahead of the beat, gated reverb snare, analog saw synth lead riff, tenor saxophone solo in the bridge and outro, female vocal with breathy tone mixed back, warm tape saturation"
    # section_tags are derived from form[].name, not filled in by hand
    exclude: ["EDM drop", "trap hi-hats", "modern sidechain pumping", "orchestral epic", "fade out ending"]
    knobs: {model: "v4.5+", weirdness: "35%", style_influence: "65%"}
  yue:
    genre_tags: "city pop, japanese, female vocal, rhodes electric piano, clean guitar, tenor saxophone, analog synth lead, 112 bpm, D major, nostalgic, night drive"
    structure: ["intro", "verse", "pre-chorus", "chorus", "verse", "pre-chorus", "chorus", "bridge", "chorus", "outro"]
    ref_audio: null
    abc: null   # Compiled by mc-symbolic-score; left empty until the end-to-end pipeline runs
  midi:
    instrument_map:
      drums_acoustic: {name: "Standard Kit", program: 0, bank: 0, channel: 10}
      bass_el: {name: "Electric Bass (finger)", program: 33, bank: 0, channel: 2}
      ep_rhodes: {name: "Electric Piano 1", program: 4, bank: 0, channel: 3}
      gtr_clean_16th: {name: "Electric Guitar (clean)", program: 27, bank: 0, channel: 4}
      syn_lead_saw: {name: "Lead 2 (sawtooth)", program: 81, bank: 0, channel: 5}
      strings_pad: {name: "String Ensemble 1", program: 48, bank: 0, channel: 6}
      sax_tenor: {name: "Tenor Sax", program: 66, bank: 0, channel: 7}
      vocal_lead: {name: "Voice Oohs (generated by Suno/YuE; placeholder in the MIDI baseline)", program: 53, bank: 0, channel: 1}

checks:
  self_audit:
    - "[x] one_thing reads as one sentence — 'doesn't want to get off' — not two things"
    - "[x] the points each reference borrows do not overlap: one borrows texture, the other the distance of the vocal"
    - "[x] arrangement_hook can be hummed without reading the score: an ascending three-note riff"
    - "[x] melody_register has contrast: A section mid-low, C section mid-high, D section low, C3 high"
    - "[x] Silence: in the last 2 bars of section D the vocal stops singing and only the sax remains — the 'moment of regret' is not spoken"
  exemptions: []

# Message channel (schema §5.3): one message to the mixing stage, showing how to write one
messages:
  - from: music
    to: sound
    about: ["mix_intent.dynamics", "arrangement.subtraction_events"]
    says: "The D section sitting 6 dB below C2 is the only large drop in the whole song, and the full-band silence in the final half-beat before C2 is also deliberate. At the -10 LUFS target, please keep these two points and do not let bus compression fill them in. If they cannot be kept, reply with a note, and this package will change the C3 lineup to compensate."
    status: open
