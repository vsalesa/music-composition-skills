# ARR-SPEC blank template (v1.0)
# See ARR-SPEC.schema.md for the specification. After writing, run the 20 self-checks in mc-workflow §3.0 one by one.
# ★ marks self-check items; fix any item that fails, or state the reason.
# ★ Executable fields use ASCII only: write chords as maj7 / m7b5 / dim / b / #, not △ ø ° ♭ ♯; write repeats as x2.

# ★★ YAML hard rule (the place agents most often break it):
#   list fields (roster / sound_stage / push_pull / subtraction_events / emotional_arc …)
#   must **not** have a `note:` key hung beneath a `- {…}` entry: that is a "mapping mixed into a list", and the whole file then fails to parse.
#   To annotate a list, use a sibling `xxx_note:` key (e.g. `sound_stage_note:`), or write a `#` line comment.
#   After writing, re-read the indentation.

spec_version: "1.0"

meta:
  title: ""
  style_layer: "none"          # L3 skill id of the base style; write none if not built yet
  style_layers: []             # ✦ fill in when styles are mixed: [{skill, role: base|overlay, owns: [dimensions…]}]; leave empty for a single style. See schema §1.1.1
  fusion_note: ""              # ✦ when mixing, one sentence on why it works
  key: ""                      # ★ lint#20 syntax "<tonic> <major|minor>", e.g. "F# minor" "Bb major"
  mode: ""                     # optional; fill in for non-natural major/minor: dorian/mixolydian… (the nine MusicXML modes)
  meter: "4/4"
  # meter_map: [{bar: 1, meter: "4/4"}, {bar: 33, meter: "3/4"}]   # meter changes go here, not in note
  tempo: 0
  # tempo_map: [{bar: 1, bpm: 96}]
  target_duration: "0:00"      # ★ lint#14 must agree with Σbars × tempo (±10%)
  deliverable: [full_mix]      # full_mix / stems / midi / musicxml / chordpro / abc
  upstream:                    # read if present; if absent, follow this package's own analysis; the source does not matter (schema §5.2)
    brief: ""                  # source and original wording of the requirement; write none if absent
    lyrics: {}                 # lyrics for the same song: {source, flow: composed-first|lyrics-first, shared, sections: [{id, lines: []}]}; for lyrics-first, the six shared items are locked (schema §5.4)
    picture: {}                # picture to be matched: {source, sec, hits: [{at_sec, what}], note}

# ─────────────────────────────────────────────────────────
# Required table before drafting: do not write form until all four items are filled in
# ─────────────────────────────────────────────────────────
intent:
  one_thing: ""                # ★ does only one thing. One sentence; no "both … and …"
  reference_pair:              # ★ exactly 2 items; borrow must state which point is borrowed
    - {track: "", borrow: ""}
    - {track: "", borrow: ""}
  listener_situation: ""       # ★ where it is heard, which listen this is, how much attention
  emotional_arc:               # ★ must contain a turn; rising all the way means nothing was written
    - {section: "", mood: "", value: 0}

# ───────────────────────────────────────
# Thematic material (★ owned by mc-development; lint#18). ★ Read mc-development before filling in; the field notes alone are not enough
# ───────────────────────────────────────
material:
  motif: ""                    # ★ interval contour, rhythmic pattern, length; write in words to the point of recognizability
  motif_abc: ""                # optional: one to two bars of ABC for the same motif (only L: and notes); if present, can be exported as notation
  character: ""                # one-sentence character
  stated_in: []                # section ids where the motif is first stated; at least one
  development_mode: ""         # elaboration / expansion / contrast; pick one as dominant (mc-development §5.1)

# ─────────────────────────────────────────────────────────
# Form table
# ─────────────────────────────────────────────────────────
form:
  - id: ""                     # globally unique
    name: ""                   # ★ lint#20 Intro/Verse/Pre-Chorus/Chorus/Post-Chorus/Bridge/Instrumental/Solo/Breakdown/Drop/Outro
    bars: 0                    # ★ lint#3 the whole song must not consist entirely of multiples of 8
    start_bar: 0               # ★ lint#2 must join end to end
    harmony: ""                # "|VIm7 |IVmaj7 |I |V |"   ASCII: bVI, #IVm7b5, V/V
    harmony_letters: ""        # ★ lint#19 "|F#m7 |Dmaj7 |A |E |"   dual notation is a hard convention; two chords in one bar are separated by spaces; for uneven division write beat counts: Em7(3) A(1)
    melody_register: ""        # low / mid-low / mid / mid-high / high
    # melody_range: "A3-E5"    # optional, actual range; exported if present
    development: ""            # ★ lint#18 repeat/sequence/extend/contract/fragment/vary/augment/counterpoint/new/recap; primary+secondary joined with "+"
    energy: 0                  # 0–10
    events: []                 # [drums_in, bass_in, gtr_out]; only <roster_id>_in / _out are recognized
    note: ""                   # asymmetric design goes here; meter changes go in meter_map

# ─────────────────────────────────────────────────────────
# Arrangement
# ─────────────────────────────────────────────────────────
arrangement:
  roster:
    - id: ""
      instrument: ""           # a specific timbre; category words such as "synth" are not allowed
      midi: {program: 0, bank: 0, channel: 1}   # GM program number; drum kit channel 10; required when deliverable includes midi/musicxml
      role: ""                 # groove / low end / harmonic pad / texture / melody / color / memory hook
      band: ""                 # "1-3 kHz" or low / mid-low / mid-high / high
      entry: ""                # ★ section id
      exit: ""                 # ★ lint#7 at least one item is not end
      note: ""

  depth_map:          # ✦ {roster_id: foreground|midground|background}. Listeners judge foreground by high / loud / fast / rate of change; only "loud" can be adjusted at mixing
  bass_kick_relation: # ✦ {mode: locked|call-and-response|interlocking, detail}. Choose one and state it
  spectrum_budget:
    - {band: "", owner: "", competitors: [], resolution: ""}   # yield frequency / separate registers / alternate

  energy_curve: {}             # ★ lint#4 key set == form ids; lint#5 at least one drop

  subtraction_events:          # ★ lint#6 at least 1; at is a structured position (schema §1.9), not a sentence
    - {at: {section: "", bar_offset: 0}, what: "", why: ""}

  hooks:
    vocal_hook: {where: "", shape: ""}
    arrangement_hook:          # ★ lint#8 non-vocal memory point, required
      what: ""
      first_at: ""
      recurs_at: []
      abc: ""                  # optional, one to two bars of ABC

  groove:
    feel: ""                   # straight/swing16/shuffle/halftime/2:1/3:1
    push_pull:                 # ★ lint#11 at least one item with offset_ms != 0
      - {part: "", offset_ms: 0, note: ""}
    fill_policy:               # ★ lint#10 bars must not be an arithmetic sequence with common difference 4
      bars: []
      rationale: ""

# ─────────────────────────────────────────────────────────
# Vocal design (mc-vocal-direction): directs how the generation model sings; not a recording guide for human singers
# The voice is where listener attention is most concentrated; this layer is the second-largest source of AI flavor (the first is the lyrics)
# ─────────────────────────────────────────────────────────
vocal:
  persona: ""                  # ★ who is singing: gender, vocal range, texture, sense of era; writing "female voice" alone counts as unfilled
  delivery: ""                 # breathy / full / mixed; articulation tightness
  dynamics_by_section: {}      # ★ lint#15 at least two different values; same level throughout is forbidden; 0–10; export maps to ppp–fff per schema §1.5
  phrasing: []                 # [{line: "", timing: "lay back 60ms" / "rush 30ms", why: ""}]
  breath_points: []            # [{section: "", line: 1, after_syllable: 4, note: ""}]; exported as breath-mark
  ad_libs: []                  # [{at: {section: ""}, what: ""}]; ★ scattering them evenly is forbidden
  chorus_variation: ""         # ★ lint#16 how the three chorus passes differ from one another
  stacking: ""                 # harmony / doubling: how many layers, and on which lines they enter
  register_arc: ""             # consistent with form[].melody_register

# ─────────────────────────────────────────────────────────
# Mix intent (intent only; EQ / compression / mastering are the mixing engineer's job)
# ─────────────────────────────────────────────────────────
mix_intent:
  mood: ""                     # ★ one sentence; has veto power over all other decisions
  sound_stage: []              # [{id: "", pan: 0, depth: foreground|midground|background}]; pan takes -100..100, negative left, positive right
  ducking_map:
    - {section: "", who_yields: "", band: "", to: ""}
  dynamics:
    target_DR_dB: 0
    notes: []                  # "which section must be x dB quieter than the chorus"
  width_map: {}                # ★ lint#12 at least two different values
  loudness_target: ""          # "-9 LUFS integrated"

# ─────────────────────────────────────────────────────────
# Compile targets
# ─────────────────────────────────────────────────────────
render:
  suno:
    style_prompt: ""           # ★ lint#13 non-empty; avoid content-free words such as epic/emotional/beautiful
    # section_tags: []         # derived from form[].name, no need to fill by hand; if filled, must match form
    exclude: []
    knobs: {model: "", weirdness: "", style_influence: ""}
  yue:
    abc: ""           # ✦ ABC score that can be fed directly to YuE2GenerateMusic (produced by mc-symbolic-score)
    genre_tags: ""
    structure: []
    ref_audio: null
  midi:
    instrument_map: {}         # {roster_id: {name: "VST or sample-library name", program: 0, bank: 0, channel: 1}}; GM numbers follow roster[].midi
  musicxml:
    lead_sheet: true           # vocal lead sheet: melody, chords, lyrics, sections, dynamics, breath marks
    parts: []                  # roster ids of extra parts
  chordpro:
    transpose: 0

# ─────────────────────────────────────────────────────────
# Manual self-audit (automatic items are run by lint)
# ─────────────────────────────────────────────────────────
checks:
  self_audit:
    - "[ ] one_thing, read aloud, is one sentence, not two things stitched together"
    - "[ ] the points borrowed from the two references do not overlap"
    - "[ ] arrangement_hook can be hummed without reading the score"
    - "[ ] melody_register differs clearly from the neighboring sections in at least one section"
    - "[ ] somewhere in the song there is a place where something that should be said is left unsaid (a rest); state where:"
  exemptions: []               # when exempting a lint item, state the item number and reason here

# ─────────────────────────────────────────────────────────
# Message channel (schema §5.3): shared area; either side may write; if no reply is read, treat it as none; this package does not wait
# ─────────────────────────────────────────────────────────
messages: []
# One entry: {from: music, to: sound, about: "mix_intent.dynamics", says: "what the other side should do and why", status: open}
# from / to closed set: music (this package) lyrics sound editing shot-design writing production; the two must differ
# status: open (sent, no reply yet) / answered (replied, field not changed) / accepted (field changed as requested) / rejected (reply states the reason)
