# Generation backend capability profiles — data, not a skill
#
# To add a new model, add a block here; **do not touch any skill**.
# `mc-render-compile` reads this profile to decide how to compile ARR-SPEC;
# when computing compliance, `honors` is read to decide which items are scored.
#
# ★ The three values of `honors` determine how compliance is computed:
#     exact — the backend can execute this field precisely → scored; falling short means it did not do it
#     hint  — the backend can only influence generation as a suggestion → scored, but down-weighted
#     none  — the backend does not accept this field at all → **excluded from scoring**, marked "not supported by this backend"
#   Scoring `none` items as 0 is wrong: Suno was never told exact chords,
#   so docking its score for "chords not followed" penalizes it for something it cannot do.
#
# ★ `transport` records "where this backend usually runs"; it is data, not a precondition.
#   The readers of this library are agents: mc-render-compile produces each backend's input values (prompt / ABC / parameters),
#   and whether the user runs them from the command line, the Python API, or a node-based carrier such as ComfyUI is decided by the user's environment.
#   Values: hosted (managed service) / local (local weights). `known_carriers` lists known carriers that can run it, for reference only.
#
# Research date: 2026-09-15

version: 2

backends:

  # ═══════════════════════════════════════════════════════════
  - id: yue2
    name: "YuE2 (3B)"
    transport: local
    known_carriers:
      comfyui: [audio_yue2_text2music, audio_yue2_music_cover]   # reference: template names for this carrier
    note: >
      ★ The only backend that lets ARR-SPEC be **executed** rather than **prompted**.
      It works in two steps: symbolic planning (the model writes ABC itself) → synthesizes audio from that ABC.
      **Bypass the first step**: feed the ABC we compile from ARR-SPEC directly into the second step.
      Any carrier that supports YuE2 can be wired this way (official script; ComfyUI has a native node).
      This is the first landing point for mc-symbolic-score.
      ★ Measured (2026-09-17): injected ABC uses L:1/32, the vocal line is written in the lowercase note range with w: lines; L:1/16 stops halfway through, and words in the uppercase range come out as muddy vowels. Whisper recognition rate: direct output 76%, compiled score 56%; the gap lies in melodic density. Details in mc-symbolic-score §6b.
    license:
      code: Apache-2.0
      weights: CC-BY-NC-4.0
      commercial_ok: false        # ★ weights are non-commercial; must be confirmed before release
    model_file: yue2_3b_int8_convrot.safetensors
    accepts:
      style_prompt: prose
      lyrics: text
      symbolic_score: abc               # ★ no other backend has this
      reference_audio: "cover template supported (keeps original melody, changes style)"
      seed: true
    honors:
      meta.key: exact
      meta.tempo: exact
      meta.meter: exact
      form.bars: exact
      form.harmony: exact
      form.name: exact
      arrangement.roster: hint
      arrangement.energy_curve: hint
      vocal: hint
      mix_intent: none
    upstream_skill: >
      The official repo ships skills/yue2-music/ (SKILL.md format, including "check musical invariants").
      ★ Do not rewrite it: we write the ARR-SPEC→ABC adapter, and the model's operating knowledge references theirs.

  # ═══════════════════════════════════════════════════════════
  - id: minimax-music-3
    name: "MiniMax Music 3"
    transport: local
    known_carriers:
      comfyui: [audio_minimax_music_3]   # reference: template names for this carrier
    note: >
      The hosted API is closed to new users, but a local-weights version exists
      (natively supported by carriers such as ComfyUI); access restrictions do not apply to the local version.
      Official description: generates a complete 5-minute song from a text prompt, with stable structure.
    license:
      commercial_ok: "weight license under review"
    accepts:
      style_prompt: prose
      lyrics: text
      symbolic_score: false
      reference_audio: "hosted version supports cover; local version under review"
    honors:
      meta.tempo: hint
      meta.key: hint
      form.bars: none
      form.harmony: none
      form.name: hint
      arrangement: hint
      vocal: hint
      mix_intent: none

  # ═══════════════════════════════════════════════════════════
  - id: ace-step-1.5
    name: "ACE-Step 1.5 XL (Base / Turbo / SFT / 4B-LLM / AIO)"
    transport: local
    templates:
      - audio_ace_step1_5_xl_base
      - audio_ace_step1_5_xl_turbo      # distilled version, fast
      - audio_ace_step1_5_xl_sft        # adjustable CFG; most controllable prompt adherence
      - audio_ace_step_1_5_split_4b     # 4B LLM version, stronger musical understanding
      - audio_ace_step_1_5_checkpoint   # AIO
    note: >
      ★ An easily overlooked family. One model, five variants; **the variants themselves are adjustable knobs**:
      Turbo for quickly trying out specs, SFT uses CFG to tune prompt adherence, and the 4B-LLM version has the strongest understanding.
      For A/B work this is easier to control than switching models: there are fewer variables within one family.
    accepts:
      style_prompt: "style tags + prose"
      lyrics: text
      symbolic_score: false
      cfg: true                         # ★ adjustable in the SFT version; directly affects how well it follows instructions
      seed: true
    honors:
      meta.tempo: hint
      meta.key: hint
      form.bars: none
      form.harmony: none
      form.name: hint
      arrangement: hint
      vocal: hint
      mix_intent: none

  # ═══════════════════════════════════════════════════════════
  - id: stable-audio-3
    name: "Stable Audio 3.0 Medium"
    transport: local
    known_carriers:
      comfyui: [audio_stable_audio_3_medium, audio_stable_audio_3_medium_base]   # reference: template names for this carrier
    note: >
      Leans toward sound effects and instrumental music; not a whole-song backend. Use: generate separately the signature timbres
      used by arrangement_hook, and riser / impact-type sound events, then feed them back into the lineup of other backends.
      Some carrier templates first use an LLM to expand the prompt.
    accepts:
      style_prompt: prose
      lyrics: false                     # ★ no vocals
      duration: true
      seed: true
      category: true
    honors:
      meta.tempo: hint
      form: none
      arrangement.hooks: hint           # only meaningful for individual sound events
      vocal: none
      mix_intent: none

  # ═══════════════════════════════════════════════════════════
  - id: suno
    name: "Suno"
    transport: hosted                   # managed service, no local weights
    note: >
      Weakest control, most polished output. It can only take section tags added to a prose style description;
      key, harmony and bar count can only be "suggested", and the model follows them as it pleases.
    license:
      commercial_ok: "depends on subscription tier; confirm yourself before release"
    accepts:
      style_prompt: prose
      lyrics: text
      section_tags: true
      exclude_tags: true
      symbolic_score: false
    honors:
      meta.tempo: hint
      meta.key: hint
      meta.meter: none
      form.bars: none                   # ★ cannot be steered; do not dock points for this
      form.harmony: none                # ★ same as above
      form.name: hint
      arrangement.roster: hint
      arrangement.energy_curve: hint
      vocal: hint
      mix_intent: none
    strategy: >
      Do not force control you cannot have: put effort into the information density of the style description and the sequence of section tags,
      then select with best-of-N plus compliance ranking, rather than hoping to persuade it in one go.

  # ═══════════════════════════════════════════════════════════
  - id: symbolic
    name: "Symbolic path: ABC / MIDI / MusicXML → sound-source rendering"
    transport: local
    note: >
      The LLM outputs the symbolic score directly and hands it to sound-source rendering. **Fully deterministic, fully controllable**;
      the cost is no vocals, and timbre depends on the sound source. Two uses:
      ① the Japanese MIDI uchikomi (step-input) workflow already takes this form;
      ② the **controlled-variable baseline** for A/B: the same spec always renders identically.
      ABC ↔ MusicXML ↔ MIDI can be converted among each other, so one emitter in mc-symbolic-score
      serves both YuE2's ABC input and this path.
    license: {commercial_ok: true}
    accepts:
      symbolic_score: [abc, midi, musicxml]
    honors:
      meta.key: exact
      meta.tempo: exact
      meta.meter: exact
      form.bars: exact
      form.harmony: exact
      arrangement.roster: exact
      arrangement.energy_curve: exact   # velocity / CC can be written precisely
      vocal: none
      mix_intent: none

# ═══════════════════════════════════════════════════════════
# Companion tools (not generation backends, but part of the same chain)
tools:
  - id: audio-separation
    transport: any
    known_carriers: {demucs: cli, comfyui: utility-audioseparation}
    note: >
      ★ Stem separation: vocals / bass / drums / other.
      The four AI-flavor criteria of the vocal audit (whether dynamics stay consistent throughout, whether the three chorus passes are identical, breathing, ad-libs)
      all require separating the vocal track first. Which separation tool to use is decided by the user's environment.
