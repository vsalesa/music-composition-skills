# ARR-SPEC example 0: counter-example — "what the model writes when there is no skill guidance"
#
# Purpose: negative sample (8 of the 17 self-check items should fail); material for the A group in the AB experiment.
# This spec is not made up: it copies every Suno default value —
# sections are all multiples of 8, energy climbs steadily, the lineup never changes, one loop runs to the end,
# a fill every 4 bars, everything aligned to the grid, constant width, duration always 3:30.
# Each item "looks fine" on its own; together they add up to a wall of AI flavor.

spec_version: "1.0"

meta:
  title: "Midnight Dreams (counter-example)"
  style_layer: "none"
  key: "C major"
  mode: "ionian"
  meter: "4/4"
  tempo: 120
  target_duration: "3:30"        # ← deviates from the 3:12 implied by 96 bars, but within 10%, so item 14 passes
  deliverable: [full_mix]

intent:
  one_thing: "A song about love and loss, and at the same time about hope and dreams."   # ← two things stitched together; the human check fails
  reference_pair:
    - {track: "The Weeknd - Blinding Lights", borrow: ""}      # ← song title only, no note of what is borrowed
    - {track: "", borrow: ""}
  listener_situation: ""
  emotional_arc:
    - {section: A1, mood: "melancholy", value: 3}
    - {section: C1, mood: "explosive", value: 8}

material:
  motif: "No recognizable motif: each melody is written independently, and listeners only remember the chorus lyrics"
  character: ""
  stated_in: []

form:
  - {id: I,  name: "Intro",      bars: 8,  start_bar: 1,  harmony: "|I |V |VIm |IV |", harmony_letters: "|C |G |Am |F |", melody_register: "mid", development: new, energy: 2, events: [], note: ""}
  - {id: A1, name: "Verse",      bars: 16, start_bar: 9,  harmony: "|I |V |VIm |IV |", harmony_letters: "|C |G |Am |F |", melody_register: "mid", development: new, energy: 3, events: [], note: ""}
  - {id: B1, name: "Pre-Chorus", bars: 8,  start_bar: 25, harmony: "|I |V |VIm |IV |", harmony_letters: "|C |G |Am |F |", melody_register: "mid", development: new, energy: 5, events: [], note: ""}
  - {id: C1, name: "Chorus",     bars: 16, start_bar: 33, harmony: "|I |V |VIm |IV |", harmony_letters: "|C |G |Am |F |", melody_register: "mid", development: new, energy: 6, events: [], note: ""}
  - {id: A2, name: "Verse",      bars: 16, start_bar: 49, harmony: "|I |V |VIm |IV |", harmony_letters: "|C |G |Am |F |", melody_register: "mid", development: new, energy: 7, events: [], note: ""}
  - {id: C2, name: "Chorus",     bars: 16, start_bar: 65, harmony: "|I |V |VIm |IV |", harmony_letters: "|C |G |Am |F |", melody_register: "mid", development: new, energy: 8, events: [], note: ""}
  - {id: D,  name: "Bridge",     bars: 8,  start_bar: 81, harmony: "|I |V |VIm |IV |", harmony_letters: "|C |G |Am |F |", melody_register: "mid", development: new, energy: 9, events: [], note: ""}
  - {id: C3, name: "Chorus",     bars: 8,  start_bar: 89, harmony: "|I |V |VIm |IV |", harmony_letters: "|C |G |Am |F |", melody_register: "mid", development: new, energy: 10, events: [], note: ""}

arrangement:
  roster:
    - {id: drums,   instrument: "drums",     role: "groove",         band: "full range", entry: I, exit: end, note: ""}
    - {id: bass,    instrument: "bass",      role: "low end",        band: "low end",    entry: I, exit: end, note: ""}
    - {id: piano,   instrument: "piano",     role: "harmonic bed",   band: "mid range",  entry: I, exit: end, note: ""}
    - {id: pad,     instrument: "synth pad", role: "color",          band: "mid-high",   entry: I, exit: end, note: ""}
    - {id: vocal,   instrument: "vocal",     role: "melody",         band: "mid range",  entry: I, exit: end, note: ""}

  spectrum_budget: []

  energy_curve: {I: 2, A1: 3, B1: 5, C1: 6, A2: 7, C2: 8, D: 9, C3: 10}   # ← strictly increasing

  subtraction_events: []          # ← none at all

  hooks:
    vocal_hook: {where: "chorus", shape: "catchy and easy to sing along to"}
    arrangement_hook: {what: "", first_at: "", recurs_at: []}   # ← empty

  groove:
    feel: "straight"
    push_pull:
      - {part: drums, offset_ms: 0, note: ""}
      - {part: bass,  offset_ms: 0, note: ""}                   # ← all aligned to the grid
    fill_policy:
      bars: [8, 12, 16, 20, 24, 28]                             # ← one every 4 bars
      rationale: "standard fill"

mix_intent:
  ducking_map: []
  dynamics: {target_DR_dB: 6, notes: []}
  width_map: {I: wide, A1: wide, B1: wide, C1: wide, A2: wide, C2: wide, D: wide, C3: wide}  # ← constant
  loudness_target: "-8 LUFS integrated"

render:
  suno:
    style_prompt: "emotional pop ballad, beautiful melody, epic chorus, high quality"   # ← all uninformative words
    section_tags: ["[Intro]", "[Verse]", "[Chorus]", "[Bridge]", "[Outro]"]             # ← 5 items ≠ 8 sections
    exclude: []
    knobs: {}
  yue:
    genre_tags: "pop, emotional"
    structure: []
    ref_audio: null
  midi:
    instrument_map: {}

checks:
  self_audit:
    - "[ ] one_thing reads as one sentence, not two things stitched together"
    - "[ ] the points borrowed from the two references do not overlap"
    - "[ ] arrangement_hook can be hummed without reading the score"
    - "[ ] at least one section's melody_register is clearly different from its neighbors"
    - "[ ] somewhere in the song something that should be said is left unsaid (a silence); state where:"
  exemptions: []
